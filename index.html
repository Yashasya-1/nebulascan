<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NebulaScan — AI-assisted anomaly detection for TESS light curves</title>
<meta name="description" content="Screen. Inspect. Investigate. AI-assisted anomaly detection for TESS light curves, built for human verification.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>:root{
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#04050d; --navy:#0a1128; --navy2:#111c40; --purple:#2b1659; --violet:#a58bff; --blue:#4a72b0;
  --cyan:#7fdcec; --text:#eef1fb; --muted:#a3acc9; --dim:#6f7aa0; --line:rgba(150,170,255,.15); --line2:rgba(150,170,255,.28);
  --glass:rgba(11,16,38,.62); --glass2:rgba(18,26,58,.55);
  --amber:#f0b35a; --green:#72e3b4; --red:#ff7d8d;
  --font:"Space Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --nav-h:68px;
}
html{scroll-padding-top:calc(var(--nav-h) + env(safe-area-inset-top,0px) + 12px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-3;pointer-events:none;
  background:
   radial-gradient(900px 600px at 82% -8%,rgba(72,36,150,.42),transparent 62%),
   radial-gradient(800px 700px at -8% 38%,rgba(22,48,120,.40),transparent 60%),
   radial-gradient(700px 500px at 70% 105%,rgba(60,30,120,.32),transparent 60%),
   radial-gradient(500px 360px at 30% 8%,rgba(60,170,200,.07),transparent 65%),
   linear-gradient(180deg,#05061200,#04050d)}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none}
a{color:var(--cyan);text-decoration:none}
a:hover{text-decoration:underline}
img{max-width:100%}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:6px}
.mono{font-family:var(--mono);font-feature-settings:"zero" 1}
.wrap{width:min(1200px,100% - 40px);margin-inline:auto}
.wrap.wide{width:min(1440px,100% - 32px)}
h1,h2,h3,h4{font-family:var(--font);line-height:1.12;margin:0;font-weight:500;letter-spacing:-.02em}
h2{font-size:clamp(28px,4vw,46px)}
h3{font-size:21px;letter-spacing:-.01em}
p{margin:0}
.lead{font-size:clamp(17px,1.7vw,20px);color:var(--muted);max-width:62ch;line-height:1.55}
.muted{color:var(--muted)} .dim{color:var(--dim)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- loader ---------- */
#loader{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;transition:opacity .7s ease,visibility .7s}
#loader.done{opacity:0;visibility:hidden}
.load-inner{display:grid;gap:18px;justify-items:center;text-align:center}
.load-ring{position:relative;width:132px;height:132px;display:grid;place-items:center}
.load-ring::before{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid var(--line2);border-top-color:var(--cyan);animation:spin 1.6s linear infinite}
.load-ring img{width:92px;height:92px;border-radius:50%;box-shadow:0 0 40px rgba(110,140,255,.35)}
.load-txt{font-family:var(--mono);font-size:12px;color:var(--dim)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- nav ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:50;padding-top:env(safe-area-inset-top,0px);transition:background .3s,border-color .3s,backdrop-filter .3s;border-bottom:1px solid transparent}
.nav.solid{background:rgba(5,7,18,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom-color:var(--line)}
.nav-in{height:var(--nav-h);display:flex;align-items:center;gap:28px}
.brand{display:flex;align-items:center;gap:12px;color:var(--text);font-weight:600;font-size:19px;letter-spacing:-.01em}
.brand:hover{text-decoration:none}
.brand img{width:42px;height:42px;border-radius:50%;display:block;box-shadow:0 0 0 1px var(--line2),0 0 22px rgba(90,120,230,.35)}
.nav-links{display:flex;gap:4px;margin-left:12px;flex:1}
.nav-links a{color:var(--muted);padding:8px 13px;border-radius:999px;font-size:15px;transition:color .2s,background .2s}
.nav-links a:hover{color:var(--text);text-decoration:none;background:rgba(150,170,255,.08)}
.nav-links a.on{color:var(--text);background:rgba(150,170,255,.14)}
.burger{display:none;background:none;border:1px solid var(--line2);color:var(--text);width:42px;height:42px;border-radius:12px;cursor:pointer;margin-left:auto}
.burger span,.burger span::before,.burger span::after{display:block;width:18px;height:1.5px;background:currentColor;position:relative;margin:auto;transition:transform .25s}
.burger span::before,.burger span::after{content:"";position:absolute;left:0}
.burger span::before{top:-6px}.burger span::after{top:6px}

.nav-links .m-only{display:none}
@media (max-width:960px){
  .burger{display:block}
  .nav .btn{display:none}
  .nav-links{position:fixed;top:calc(var(--nav-h) + env(safe-area-inset-top,0px));left:0;right:0;flex-direction:column;margin:0;padding:12px 20px 20px;background:rgba(5,7,18,.96);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);transform:translateY(-12px);opacity:0;visibility:hidden;transition:.25s}
  .nav-links.open{transform:none;opacity:1;visibility:visible}
  .nav-links a{padding:13px 12px;font-size:17px}
  .nav-links .m-only{display:block}
}

/* ---------- buttons / badges ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font:500 15px var(--font);border-radius:999px;padding:12px 22px;border:1px solid var(--line2);color:var(--text);background:rgba(150,170,255,.06);cursor:pointer;transition:transform .2s,background .2s,border-color .2s,box-shadow .2s;white-space:nowrap}
.btn:hover{text-decoration:none;background:rgba(150,170,255,.14);border-color:rgba(160,185,255,.5)}
.btn.primary{background:linear-gradient(135deg,#3b5bd6,#7a52e0);border-color:transparent;box-shadow:0 6px 26px -8px rgba(110,100,255,.7)}
.btn.primary:hover{background:linear-gradient(135deg,#4a6ae6,#8b63f0);transform:translateY(-1px)}
.btn.sm{padding:8px 15px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.badge{display:inline-flex;align-items:center;gap:6px;font:500 11px var(--mono);letter-spacing:.06em;padding:4px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);background:rgba(150,170,255,.06);text-transform:uppercase;white-space:nowrap}
.badge i{width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.violet{color:#c9b8ff;border-color:rgba(165,139,255,.5);background:rgba(120,80,230,.14)}
.badge.cyan{color:var(--cyan);border-color:rgba(127,220,236,.45);background:rgba(60,170,200,.1)}
.badge.amber{color:var(--amber);border-color:rgba(240,179,90,.45);background:rgba(240,179,90,.09)}
.badge.green{color:var(--green);border-color:rgba(114,227,180,.45);background:rgba(114,227,180,.08)}
.badge.red{color:var(--red);border-color:rgba(255,125,141,.45);background:rgba(255,125,141,.08)}

/* ---------- surfaces ---------- */
.glass{background:var(--glass);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 50px -30px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.04)}
.card{padding:24px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:980px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
.rv{opacity:0;transform:translateY(14px);transition:opacity .8s ease,transform .8s ease}
.rv.in{opacity:1;transform:none}
section.s{padding:clamp(64px,9vw,120px) 0}
.sec-head{display:grid;gap:16px;margin-bottom:44px;max-width:780px}
main{min-height:70vh;transition:opacity .25s ease}
main.out{opacity:0}
.page-head{padding:calc(var(--nav-h) + 64px) 0 36px}
.page-head h1{font-size:clamp(36px,5.4vw,66px);font-weight:500;margin-bottom:18px}

/* ---------- hero ---------- */
.hero{position:relative;padding:calc(var(--nav-h) + clamp(40px,7vw,90px)) 0 40px;overflow:hidden}
.hero-gal{position:absolute;right:-12%;top:-8%;width:min(1100px,110vw);aspect-ratio:3/2;opacity:.5;z-index:-1;will-change:transform;-webkit-mask-image:radial-gradient(closest-side,#000 40%,transparent 100%);mask-image:radial-gradient(closest-side,#000 40%,transparent 100%)}
.hero-gal canvas{width:100%;height:100%;display:block}
.hero h1{font-size:clamp(46px,8.4vw,116px);font-weight:400;letter-spacing:-.045em;line-height:.98;max-width:12ch}
.hero .lead{margin-top:28px}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:34px}
.instrument{margin-top:clamp(40px,6vw,76px);padding:0;overflow:hidden;position:relative}
.instrument-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);font:12px var(--mono);color:var(--dim)}
.instrument-bar b{color:var(--muted);font-weight:500}
.live{display:inline-flex;align-items:center;gap:8px}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.8)}}
.chart-box{position:relative;width:100%}
.chart-box canvas{display:block;width:100%;height:100%;touch-action:pan-y}
.ctip{position:absolute;pointer-events:none;z-index:5;min-width:150px;background:rgba(8,11,28,.94);border:1px solid var(--line2);border-radius:10px;padding:9px 12px;font:12px/1.55 var(--mono);color:var(--text);opacity:0;transition:opacity .12s;box-shadow:0 10px 30px -10px #000}
.ctip.on{opacity:1}
.ctip em{font-style:normal;color:var(--violet)}
.ctip small{display:block;color:var(--amber);font-size:11px}
.credo{padding:60px 0 20px;text-align:center}
.credo p{font-size:clamp(22px,3.2vw,38px);font-weight:300;letter-spacing:-.02em;max-width:24ch;margin:auto;line-height:1.2;color:#dfe5ff}
.credo .bits{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:28px}
.chip{font:12px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:6px 12px;background:rgba(150,170,255,.04)}

/* ---------- flow ---------- */
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:0;position:relative;margin:8px 0 54px}
.fnode{position:relative;text-align:center;padding:0 6px}
.fnode .dot{width:58px;height:58px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;border:1px solid var(--line2);background:var(--navy);position:relative;z-index:2}
.fnode .dot svg{width:26px;height:26px;stroke:var(--cyan);fill:none;stroke-width:1.5}
.fnode b{display:block;font:500 12px var(--mono);letter-spacing:.04em;color:var(--muted)}
.fnode::after{content:"";position:absolute;top:29px;left:calc(50% + 34px);right:calc(-50% + 34px);height:1px;background:linear-gradient(90deg,var(--line2),var(--line2));z-index:1}
.fnode:last-child::after{display:none}
.fnode::before{content:"";position:absolute;top:27px;left:calc(50% + 34px);width:6px;height:5px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);z-index:3;animation:packet 4.8s linear infinite;animation-delay:var(--d,0s);opacity:0}
.fnode:last-child::before{display:none}
@keyframes packet{0%{opacity:0;left:calc(50% + 34px)}8%{opacity:1}35%{opacity:1}45%,100%{opacity:0;left:calc(150% - 40px)}}
.fnode.hum .dot{border-color:var(--violet);box-shadow:0 0 0 6px rgba(165,139,255,.1),0 0 30px rgba(165,139,255,.35);background:#1b1245}
.fnode.hum .dot svg{stroke:#d3c6ff}
.fnode.hum b{color:#d3c6ff}
@media (max-width:760px){
  .flow{grid-template-columns:1fr;gap:20px;margin-left:8px}
  .fnode{display:flex;align-items:center;gap:16px;text-align:left}
  .fnode .dot{margin:0}
  .fnode::after{top:58px;bottom:-20px;left:29px;right:auto;width:1px;height:auto}
  .fnode::before{display:none}
}
.step{padding:26px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.step .n{font:500 13px var(--mono);color:var(--cyan)}
.step h3{font-size:24px}
.step ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.step li{display:flex;gap:10px;color:var(--muted);font-size:15px}
.step li::before{content:"";flex:none;width:5px;height:5px;margin-top:10px;border-radius:50%;background:var(--cyan)}
.step.verify{grid-column:1/-1;border-color:rgba(165,139,255,.5);background:linear-gradient(120deg,rgba(60,30,130,.45),rgba(12,16,40,.7) 60%);box-shadow:0 0 60px -20px rgba(140,100,255,.55)}
.step.verify .cols{display:grid;grid-template-columns:1.1fr 1fr;gap:34px;align-items:center}
.step.verify h3{font-size:clamp(26px,3vw,34px)}
.step.verify .n{color:#cdbdff}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.checks div{border:1px solid var(--line2);border-radius:12px;padding:14px;font-size:14px;color:var(--muted);background:rgba(8,10,28,.5)}
.checks div b{display:block;color:var(--text);font-weight:500;margin-bottom:2px}
@media (max-width:860px){.step.verify .cols{grid-template-columns:1fr}.checks{grid-template-columns:1fr}}

/* ---------- art panels ---------- */
.art{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.art svg,.art canvas{display:block;width:100%;height:auto}
.art figcaption{position:absolute;left:0;right:0;bottom:0;padding:34px 18px 14px;background:linear-gradient(transparent,rgba(3,4,12,.88));font-size:13px;color:var(--muted)}
figure{margin:0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,70px);align-items:center}
@media (max-width:860px){.split{grid-template-columns:1fr}}
.band{position:relative;border-radius:24px;overflow:hidden;min-height:420px;display:grid;align-items:end;border:1px solid var(--line)}
.band canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.band .over{position:relative;padding:clamp(28px,5vw,60px);background:linear-gradient(0deg,rgba(3,4,12,.92),rgba(3,4,12,.0));display:grid;gap:14px;max-width:760px}
.band .over p.big{font-size:clamp(26px,3.6vw,44px);font-weight:300;letter-spacing:-.02em;line-height:1.15}

/* ---------- explorer ---------- */
.xp{padding-top:calc(var(--nav-h) + 22px);padding-bottom:40px}
.demo-note{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);border:1px dashed var(--line2);border-radius:12px;padding:9px 14px;margin-bottom:16px;background:rgba(150,170,255,.03)}
.demo-note button{background:none;border:0;color:var(--cyan);cursor:pointer;font:inherit;padding:0;text-decoration:underline}
.xp-grid{display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1020px){.xp-grid{grid-template-columns:1fr}}
.side{position:sticky;top:calc(var(--nav-h) + 14px);display:flex;flex-direction:column;max-height:calc(100vh - var(--nav-h) - 30px);overflow:hidden}
@media (max-width:1020px){.side{position:static;max-height:none}}
.filters{padding:16px 16px 6px;border-bottom:1px solid var(--line);overflow:auto;max-height:52vh}
.fl{display:grid;gap:7px;margin-bottom:15px}
.fl label,.fl .lab{font:12px var(--mono);color:var(--dim);display:flex;justify-content:space-between}
.fl label output{color:var(--cyan)}
input[type=text],input[type=search],select,textarea{width:100%;background:rgba(5,7,20,.7);border:1px solid var(--line2);color:var(--text);border-radius:10px;padding:10px 12px;font:14px var(--mono)}
textarea{font:15px/1.55 var(--font);resize:vertical;min-height:130px}
input[type=text]:focus,select:focus,textarea:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(127,220,236,.12)}
input[type=range]{width:100%;accent-color:#8f7bff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{font:12px var(--font);padding:5px 11px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--muted);cursor:pointer;transition:.2s}
.chipbtn[aria-pressed=true]{background:rgba(120,90,240,.25);border-color:var(--violet);color:#e6deff}
.list{overflow:auto;flex:1;min-height:200px}
@media (max-width:1020px){.list{max-height:380px}}
.list-head{padding:10px 16px;font:12px var(--mono);color:var(--dim);display:flex;justify-content:space-between;position:sticky;top:0;background:rgba(9,13,32,.95);z-index:2;border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:12px 16px;border:0;border-bottom:1px solid rgba(150,170,255,.07);width:100%;background:transparent;color:var(--text);text-align:left;cursor:pointer;font-family:var(--font);transition:background .2s}
.row:hover{background:rgba(150,170,255,.06)}
.row[aria-current=true]{background:linear-gradient(90deg,rgba(120,90,240,.22),rgba(120,90,240,.04));box-shadow:inset 2px 0 var(--violet)}
.row .rk{font:500 15px var(--mono);color:var(--muted)}
.row .tic{font:14px var(--mono)}
.row .sub{font-size:12px;color:var(--dim);display:flex;gap:8px;align-items:center;margin-top:2px}
.row .sc{font:13px var(--mono);color:var(--cyan);text-align:right}
.bar{height:3px;border-radius:2px;background:rgba(150,170,255,.12);margin-top:6px;overflow:hidden;width:70px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--violet))}
.dotst{width:8px;height:8px;border-radius:50%;display:inline-block}
.empty{padding:34px 20px;text-align:center;color:var(--dim);font-size:14px}
.hrbar{display:flex;align-items:center;gap:12px;padding:11px 16px;border:1px solid rgba(240,179,90,.4);background:linear-gradient(90deg,rgba(240,179,90,.12),rgba(240,179,90,.03));border-radius:12px;font-size:14px;color:#f6d9a6;margin-bottom:16px}
.hrbar b{font:600 12px var(--mono);letter-spacing:.06em;color:var(--amber);white-space:nowrap}
.hrbar::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 12px var(--amber);animation:pulse 2s infinite}
.cand-head{padding:22px 24px;margin-bottom:16px;display:grid;gap:16px}
.cand-top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.cand-no{font:13px var(--mono);color:var(--dim)}
.cand-tic{font:500 clamp(26px,3.4vw,40px) var(--mono);letter-spacing:-.03em;line-height:1.1;margin-top:4px}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kv div{background:rgba(7,10,26,.85);padding:12px 16px}
.kv span{display:block;font-size:12px;color:var(--dim)}
.kv b{font:500 20px var(--mono);letter-spacing:-.02em}
.kv.five{grid-template-columns:repeat(5,1fr)}
@media (max-width:760px){.kv,.kv.five{grid-template-columns:repeat(2,1fr)}}
.panel{overflow:hidden;margin-bottom:16px}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel-h h3{font-size:16px;font-weight:500}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tb{background:rgba(150,170,255,.07);border:1px solid var(--line2);color:var(--text);border-radius:9px;min-width:34px;height:34px;padding:0 10px;cursor:pointer;font:13px var(--mono);transition:.2s}
.tb:hover{background:rgba(150,170,255,.18)}
.tog{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;margin-left:6px}
.tog input{accent-color:#8f7bff}
.hint{padding:8px 16px 12px;font:12px var(--mono);color:var(--dim)}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media (max-width:760px){.metrics{grid-template-columns:repeat(2,1fr)}}
.metric{padding:16px 18px}
.metric span{font-size:13px;color:var(--dim);display:block}
.metric b{display:block;font:500 22px var(--mono);letter-spacing:-.03em;margin:4px 0 2px}
.metric b.nc{font:400 15px var(--font);color:var(--dim);letter-spacing:0;padding:5px 0}
.metric small{font-size:12px;color:var(--dim);line-height:1.4;display:block}
details.exp{border:1px solid var(--line);border-radius:14px;background:var(--glass);margin-bottom:12px;overflow:hidden}
details.exp summary{cursor:pointer;padding:14px 18px;font-weight:500;display:flex;justify-content:space-between;list-style:none}
details.exp summary::-webkit-details-marker{display:none}
details.exp summary::after{content:"+";font:20px var(--mono);color:var(--cyan);transition:transform .25s}
details.exp[open] summary::after{transform:rotate(45deg)}
details.exp .in{padding:0 18px 18px;color:var(--muted);font-size:15px;display:grid;gap:10px}

/* ---------- candidate detail ---------- */
.cd-nav{position:sticky;top:calc(var(--nav-h) + env(safe-area-inset-top,0px));z-index:20;display:flex;gap:6px;overflow:auto;padding:10px 0;margin:0 0 22px;background:linear-gradient(var(--bg),rgba(4,5,13,.85));border-bottom:1px solid var(--line)}
.cd-nav button{flex:none;background:none;border:1px solid transparent;color:var(--muted);padding:7px 14px;border-radius:999px;cursor:pointer;font:14px var(--font)}
.cd-nav button:hover{background:rgba(150,170,255,.1);color:var(--text)}
.cd-sec{margin-bottom:44px}
.cd-sec>h2{font-size:clamp(22px,2.6vw,28px);margin-bottom:6px}
.cd-sec>.sub{color:var(--muted);margin-bottom:18px;max-width:70ch;font-size:15px}
.xrow{display:grid;grid-template-columns:200px 1fr auto;gap:16px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.xrow:last-child{border-bottom:0}
.xrow b{font-weight:500}.xrow small{display:block;color:var(--dim);font-size:13px}
@media (max-width:760px){.xrow{grid-template-columns:1fr;gap:6px}}
.verdict{padding:18px 22px;border-radius:14px;display:flex;gap:16px;align-items:flex-start;margin-bottom:14px;border:1px solid var(--line2)}
.verdict.k{border-color:rgba(114,227,180,.5);background:rgba(114,227,180,.06)}
.verdict.m{border-color:rgba(127,220,236,.5);background:rgba(127,220,236,.06)}
.verdict.u{border-color:rgba(165,139,255,.5);background:rgba(165,139,255,.07)}
.verdict h4{font-size:19px;font-weight:500;margin-bottom:4px}
.note{border-left:2px solid var(--amber);padding:12px 16px;background:rgba(240,179,90,.06);border-radius:0 10px 10px 0;color:#f2d9ab;font-size:14px}
.tl-mini{position:relative;height:46px;border-radius:10px;border:1px solid var(--line2);background:rgba(5,7,20,.7);overflow:hidden;margin:14px 0 6px}
.tl-mini i{position:absolute;top:0;bottom:0}
.tl-mini .fl-b{background:repeating-linear-gradient(135deg,rgba(240,179,90,.45) 0 4px,rgba(240,179,90,.15) 4px 8px)}
.tl-mini .an-b{background:rgba(165,139,255,.55);border-left:1px solid var(--violet);border-right:1px solid var(--violet);top:12px;bottom:12px;border-radius:4px}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--dim)}
.legend span::before{content:"";display:inline-block;width:12px;height:8px;border-radius:2px;margin-right:6px;background:var(--c)}
.decisions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
@media (max-width:900px){.decisions{grid-template-columns:repeat(2,1fr)}}
.dec{padding:16px 14px;border-radius:14px;border:1px solid var(--line2);background:rgba(8,11,30,.7);color:var(--text);cursor:pointer;text-align:left;font:500 15px var(--font);transition:.2s;display:grid;gap:4px}
.dec small{font:400 12px var(--font);color:var(--dim)}
.dec:hover{border-color:var(--cyan)}
.dec[aria-pressed=true]{border-color:var(--violet);background:rgba(110,80,230,.25);box-shadow:0 0 0 3px rgba(165,139,255,.15)}
.review-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:22px}
@media (max-width:900px){.review-grid{grid-template-columns:1fr}}
.cd-pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px}

/* ---------- modal ---------- */
.modal-bg{position:fixed;inset:0;z-index:90;background:rgba(2,3,10,.7);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;opacity:0;visibility:hidden;transition:.25s}
.modal-bg.on{opacity:1;visibility:visible}
.modal{width:min(520px,100%);padding:28px;transform:translateY(10px);transition:transform .25s;max-height:90vh;overflow:auto;background:rgba(12,17,40,.96)}
.modal-bg.on .modal{transform:none}
.modal h3{margin-bottom:12px;font-size:24px}
.modal .body{color:var(--muted);display:grid;gap:10px;font-size:15px}
.modal .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}

/* ---------- method / pages ---------- */
.toc-layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:48px;align-items:start}
@media (max-width:980px){.toc-layout{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:calc(var(--nav-h) + 30px);display:grid;gap:2px;border-left:1px solid var(--line)}
.toc button{background:none;border:0;text-align:left;color:var(--dim);padding:7px 16px;cursor:pointer;font:14px var(--font);margin-left:-1px;border-left:2px solid transparent}
.toc button:hover{color:var(--text)}
.toc button.on{color:var(--text);border-left-color:var(--cyan)}
.msec{margin-bottom:84px}
.msec>h2{font-size:clamp(28px,3.4vw,40px);margin-bottom:14px}
.msec>.lead{margin-bottom:26px;font-size:17px}
.stat{padding:20px 22px}
.stat b{display:block;font:400 clamp(30px,3.4vw,42px) var(--mono);letter-spacing:-.04em;color:var(--text)}
.stat span{color:var(--muted);font-size:14px;display:block;margin-top:4px;line-height:1.45}
.pipe{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}
.pipe div{position:relative;border:1px solid var(--line2);border-radius:14px;padding:16px;background:rgba(10,14,36,.7);font-size:14px;color:var(--muted)}
.pipe div b{display:block;color:var(--text);font-weight:500;margin-bottom:4px;font-size:15px}
.pipe div:not(:last-child)::after{content:"";position:absolute;right:-12px;top:50%;width:12px;height:1px;background:var(--cyan)}
@media (max-width:860px){.pipe{grid-template-columns:1fr 1fr}.pipe div::after{display:none}}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line)}
.tbl th{font-weight:500;color:var(--dim);font-size:13px}
.tbl td.m{font-family:var(--mono)}
.tbl tr:last-child td{border-bottom:0}
.tbl .best{color:var(--cyan)}
.scroll-x{overflow-x:auto}
.history{display:grid;gap:12px;position:relative;margin:18px 0}
.hist{display:grid;grid-template-columns:30px 1fr;gap:14px}
.hist .pt{width:12px;height:12px;border-radius:50%;margin:7px auto 0;position:relative;z-index:2}
.hist.bad .pt{background:var(--red);box-shadow:0 0 0 4px rgba(255,125,141,.15)}
.hist.mid .pt{background:var(--amber);box-shadow:0 0 0 4px rgba(240,179,90,.15)}
.hist.ok .pt{background:var(--green);box-shadow:0 0 0 4px rgba(114,227,180,.15)}
.hist div p{color:var(--muted);font-size:15px}
.hist div b{font-weight:500}

/* ---------- charts (svg) ---------- */
.chart-card{padding:24px 24px 18px}
.chart-card h3{margin-bottom:4px}
.chart-card .cap{color:var(--muted);font-size:14px;margin-bottom:12px;max-width:70ch}
.svgc{width:100%;height:auto;display:block;overflow:visible}
.svgc text{font-family:var(--mono);fill:var(--dim);font-size:11px}
.svgc .vl{fill:var(--muted);font-size:10.5px}
.svgc .gl{stroke:var(--line);stroke-width:1}
.svgc rect.b{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);transition:transform 1.1s cubic-bezier(.2,.7,.2,1);cursor:pointer}
.in .svgc rect.b,.svgc.in rect.b{transform:scaleY(1)}
.svgc rect.b:hover{filter:brightness(1.3)}
.svgc .eb{stroke:#fff;stroke-opacity:.6;stroke-width:1}
.leg{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:6px;font-size:13px;color:var(--muted)}
.leg span::before{content:"";display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--c);margin-right:7px;vertical-align:-1px}
.callout{display:flex;gap:14px;padding:16px 18px;border-radius:14px;border:1px solid var(--line2);background:rgba(150,170,255,.04);font-size:14.5px;color:var(--muted);margin-top:14px}
.callout.w{border-color:rgba(240,179,90,.45);background:rgba(240,179,90,.06);color:#efd5a6}
.callout b{color:var(--text);font-weight:500}
#gtip{position:fixed;z-index:95;pointer-events:none;background:rgba(8,11,28,.95);border:1px solid var(--line2);border-radius:9px;padding:7px 11px;font:12px/1.5 var(--mono);opacity:0;transition:opacity .12s;max-width:240px}
#gtip.on{opacity:1}
.host{padding:22px;display:grid;gap:10px}
.host .rk{font:400 46px var(--mono);letter-spacing:-.05em;line-height:1}
.host .rk small{font-size:16px;color:var(--dim);letter-spacing:0}

/* ---------- limits / roadmap ---------- */
.lim{padding:22px;display:grid;gap:10px;position:relative;overflow:hidden}
.lim .tag{font:12px var(--mono);color:var(--amber)}
.lim .big{font:300 38px var(--mono);letter-spacing:-.05em;color:#fff;line-height:1}
.lim p{color:var(--muted);font-size:14.5px}
.lim::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(240,179,90,.14),transparent 70%)}
.pill{font:500 11px var(--mono);padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.c{background:rgba(114,227,180,.12);color:var(--green)}
.pill.p{background:rgba(240,179,90,.12);color:var(--amber)}
.pill.n{background:rgba(255,125,141,.12);color:var(--red)}
.pill.x{background:rgba(150,170,255,.1);color:var(--muted)}
.road{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:14px;padding-top:44px}
.road::before{content:"";position:absolute;left:0;right:0;top:15px;height:1px;background:linear-gradient(90deg,var(--cyan),var(--violet) 60%,rgba(165,139,255,.15))}
.ph{position:relative;padding:18px 16px}
.ph::before{content:"";position:absolute;top:-34px;left:18px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:2px solid var(--cyan);box-shadow:0 0 14px var(--cyan)}
.ph:nth-child(n+4)::before{border-color:var(--violet);box-shadow:0 0 14px var(--violet)}
.ph .pn{font:12px var(--mono);color:var(--cyan);margin-bottom:8px}
.ph h4{font-size:17px;font-weight:500;margin-bottom:8px}
.ph p{font-size:13.5px;color:var(--muted);line-height:1.5}
@media (max-width:1100px){.road{grid-template-columns:repeat(3,1fr)}.road::before{display:none}.ph::before{display:none}}
@media (max-width:700px){.road{grid-template-columns:1fr;padding-left:22px;padding-top:0;border-left:1px solid var(--line2)}.ph::before{display:block;left:-29px;top:22px}}
.vflow{display:grid;gap:0;justify-items:center;max-width:420px;margin-inline:auto}
.vflow div{width:100%;text-align:center;padding:16px;border-radius:14px;border:1px solid var(--line2);background:var(--glass)}
.vflow div b{display:block;font-weight:500}.vflow div span{font-size:13px;color:var(--muted)}
.vflow div.ai{border-color:rgba(127,220,236,.5)}
.vflow div.hu{border-color:var(--violet);background:rgba(90,60,200,.25);box-shadow:0 0 40px -10px rgba(150,110,255,.6)}
.vflow i{width:1px;height:30px;background:linear-gradient(var(--line2),var(--cyan));position:relative}
.vflow i::after{content:"";position:absolute;bottom:-1px;left:-4px;border:4px solid transparent;border-top:6px solid var(--cyan)}
.cols-list{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.cols-list li{display:flex;gap:12px;color:var(--muted)}
.cols-list li::before{content:"×";color:var(--red);font:500 15px var(--mono);flex:none;margin-top:1px}
.cols-list.ok li::before{content:"✓";color:var(--green)}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--line);margin-top:80px;padding:56px 0 34px;background:linear-gradient(transparent,rgba(5,7,20,.8))}
.f-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:40px}
@media (max-width:760px){.f-grid{grid-template-columns:1fr}}
.f-links{display:flex;gap:10px 22px;flex-wrap:wrap;align-content:flex-start;justify-content:flex-end}
@media (max-width:760px){.f-links{justify-content:flex-start}}
.f-links a{color:var(--muted)}
.disc{margin-top:36px;padding-top:22px;border-top:1px solid var(--line);font-size:13.5px;color:var(--dim);max-width:90ch}
.cta-end{text-align:center;padding:30px 0}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .rv{opacity:1;transform:none}
  .svgc rect.b{transform:scaleY(1)}
}

.chart-card.solo .svgc{max-width:820px;margin-inline:auto}
@media (max-width:1020px){.filters{max-height:36vh}.list{max-height:300px}}

   <div class="split"><div class="rv" style="display:grid;gap:12px;color:var(--muted)"><p><b style="color:var(--text);font-weight:500">Quality filtering.</b> Cadences with any non-zero SPOC quality flag are excluded before further processing.</p><p><b style="color:var(--text);font-weight:500">Missing data.</b> Real gaps, such as momentum-dump exclusions and downlink pauses, are kept as explicit missing values through a boolean mask. They are never silently interpolated across.</p></div>${Art('<canvas id="sf"></canvas>', 'Illustrative star field, generated procedurally.')}</div>`)}

   <div class="pipe rv"><div><b>PDCSAP flux</b>Start from NASA&rsquo;s corrected product</div><div><b>Quality filter</b>Drop flagged cadences</div><div><b>Conditional detrend</b>Only if a residual trend exists</div><div><b>Safety check</b>Variance suppression &lt; 50%</div></div>`)}

   <div class="grid g4" style="margin-top:16px">${['Transit', 'Eclipsing binary', 'Periodic variability', 'Flare'].map(t => `<div class="chip" style="text-align:center;padding:12px">${t}</div>`).join('')}</div>
